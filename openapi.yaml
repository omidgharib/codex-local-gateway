openapi: 3.1.0
info:
  title: Codex Local Gateway
  version: 0.3.0
  description: >-
    Localhost-only, limited Responses API-compatible gateway for running a task
    through the user's authenticated Codex CLI session. Only documented request
    fields are accepted; unsupported OpenAI Responses API features return 400.
servers:
  - url: http://127.0.0.1:4317
    description: Local gateway
paths:
  /health:
    get:
      operationId: getGatewayHealth
      summary: Check gateway and queue health
      security: []
      responses:
        "200":
          description: Gateway is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/responses:
    post:
      operationId: runCodexTask
      summary: Run one ephemeral Codex task with a limited Responses-compatible body
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Codex task completed, or an SSE event stream when stream=true
          headers:
            x-request-id:
              description: Gateway request identifier
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
            text/event-stream:
              schema:
                type: string
                description: Responses-style events terminated by data [DONE]
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/ErrorResponse"
  /v1/models:
    get:
      operationId: listCodexModels
      summary: List models advertised by the authenticated Codex session
      description: The catalog may be cached and is not an entitlement guarantee; a completed inference verifies access for a specific request.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: include_hidden
          required: false
          schema: { type: boolean, default: false }
          description: Include models hidden from the normal Codex model picker.
      responses:
        "200":
          description: Codex model catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /v1/responses/{requestId}/cancel:
    post:
      operationId: cancelCodexTask
      summary: Cancel a queued or running request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cancellation was requested
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Run a text-only Chat Completions-compatible Codex task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat completion or SSE chunks when stream=true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /v1/logs:
    get:
      operationId: listGatewayTraces
      summary: List retained request trace metadata and queue summary
      description: Full content is excluded from this list; use the authenticated per-trace endpoint when capture is enabled.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Retained traces and aggregate summary
          content:
            application/json:
              schema:
                type: object
                required: [data, summary]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trace"
                  summary:
                    $ref: "#/components/schemas/TraceSummary"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /v1/logs/{requestId}:
    get:
      operationId: getGatewayTrace
      summary: Get one retained trace with optional captured content
      description: Full request, response, events, and error details are present only when CODEX_TRACE_CONTENT=true.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Retained trace detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TraceDetail"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-token
  schemas:
    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by, display_name, description, hidden, is_default, default_reasoning_effort, supported_reasoning_efforts, input_modalities, service_tiers]
      properties:
        id: { type: string }
        object: { type: string, const: model }
        created: { type: integer, const: 0 }
        owned_by: { type: string, const: codex }
        display_name: { type: string }
        description: { type: string }
        hidden: { type: boolean }
        is_default: { type: boolean }
        default_reasoning_effort: { type: string }
        supported_reasoning_efforts:
          type: array
          items:
            type: object
            required: [effort, description]
            properties:
              effort: { type: string }
              description: { type: string }
        input_modalities:
          type: array
          items: { type: string, enum: [text, image, audio] }
        service_tiers:
          type: array
          items:
            type: object
            required: [id, name, description]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
    QueueStats:
      type: object
      additionalProperties: false
      required: [active, queued, concurrency, max_queued, accepting]
      properties:
        active:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        concurrency:
          type: integer
          minimum: 1
        max_queued: { type: integer, minimum: 1 }
        accepting: { type: boolean }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, queue]
      properties:
        status:
          type: string
          const: ok
        queue:
          $ref: "#/components/schemas/QueueStats"
    RunRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
          description: Text input or a stateless conversation array containing messages, function_call, and function_call_output items. Images must be base64 data URLs or allowed local absolute paths.
        instructions:
          type: string
          description: Instructions prepended to the Codex task
        model:
          type: string
          description: Codex CLI model override for this request
        stream:
          type: boolean
          default: false
          description: When true, return Responses-style Server-Sent Events.
        reasoning:
          type: object
          additionalProperties: false
          properties:
            effort:
              type: string
              enum: [none, minimal, low, medium, high, xhigh]
        text:
          type: object
          additionalProperties: false
          properties:
            format:
              oneOf:
                - type: object
                  required: [type]
                  properties:
                    type: { const: text }
                - type: object
                  required: [type, schema]
                  properties:
                    type: { const: json_schema }
                    name: { type: string }
                    strict: { type: boolean }
                    schema: { type: object }
        metadata:
          type: object
          maxProperties: 16
          additionalProperties: { type: string }
        store:
          type: boolean
          const: false
          description: This ephemeral gateway only supports false.
        tools:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/FunctionTool"
          description: Caller-owned function tools. The caller executes returned calls and replays the complete history with function_call_output items.
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        parallel_tool_calls:
          type: boolean
          default: true
        working_directory:
          type: string
          description: Absolute path inside a server-configured allowed root
        mode:
          type: string
          enum: [read-only, workspace-write]
          default: read-only
        include_events:
          type: boolean
          default: false
    RunResponse:
      type: object
      additionalProperties: false
      required: [id, object, created_at, status, model, output, output_text, error, incomplete_details, queue_wait_ms, execution_ms]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: response
        created_at:
          type: integer
        status:
          type: string
          const: completed
        model:
          type: string
        output:
          type: array
          description: Responses-style assistant message array
        output_text:
          type: string
        error:
          type: "null"
        incomplete_details:
          type: "null"
        metadata:
          type: [object, "null"]
        usage:
          type: [object, "null"]
        queue_wait_ms:
          type: integer
          minimum: 0
        execution_ms:
          type: integer
          minimum: 0
        events:
          type: array
          items: {}
          description: Present only when include_events=true.
    FunctionTool:
      type: object
      additionalProperties: false
      required: [type, name, parameters]
      properties:
        type: { const: function }
        name: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        description: { type: string }
        parameters: { type: object }
        strict: { type: boolean, default: false }
    ToolChoice:
      oneOf:
        - type: string
          enum: [none, auto, required]
        - type: object
          additionalProperties: false
          required: [type, name]
          properties:
            type: { const: function }
            name: { type: string }
        - type: object
          additionalProperties: false
          required: [type, mode, tools]
          properties:
            type: { const: allowed_tools }
            mode: { type: string, enum: [auto, required] }
            tools:
              type: array
              minItems: 1
              items:
                type: object
                required: [type, name]
                properties:
                  type: { const: function }
                  name: { type: string }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        model: { type: string }
        messages:
          type: array
          minItems: 1
          items:
            type: object
            description: Text message, assistant tool-call message, or tool result message.
        stream: { type: boolean, default: false }
        max_tokens:
          type: integer
          minimum: 1
          description: Accepted for Chat Completions client compatibility; the Codex CLI does not enforce an exact output-token cap.
        stream_options:
          type: object
          additionalProperties: false
          properties:
            include_usage: { type: boolean, default: false }
        reasoning_effort: { type: string, enum: [none, minimal, low, medium, high, xhigh] }
        response_format: { type: object }
        metadata: { type: object, additionalProperties: { type: string }, maxProperties: 16 }
        store: { type: boolean, const: false }
        tools:
          type: array
          items:
            type: object
            required: [type, function]
            properties:
              type: { const: function }
              function: { type: object }
        tool_choice: {}
        parallel_tool_calls: { type: boolean, default: true }
        working_directory: { type: string }
        mode: { type: string, enum: [read-only, workspace-write], default: read-only }
        include_events: { type: boolean, default: false }
    ChatResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices: { type: array }
        usage: { type: [object, "null"] }
        metadata: { type: [object, "null"] }
    Trace:
      type: object
      required: [id, status, mode, workspace, input_chars, queued_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        mode: { type: string, enum: [read-only, workspace-write] }
        workspace: { type: string }
        input_chars: { type: integer, minimum: 0 }
        output_chars: { type: integer, minimum: 0 }
        queued_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        queue_wait_ms: { type: integer, minimum: 0 }
        execution_ms: { type: integer, minimum: 0 }
        http_status: { type: integer }
        error_type: { type: string }
        details_available: { type: boolean }
    TraceDetail:
      allOf:
        - $ref: "#/components/schemas/Trace"
        - type: object
          properties:
            detail:
              type: object
              properties:
                request: { type: object, additionalProperties: true }
                response: { type: object, additionalProperties: true }
                error: { type: object, additionalProperties: true }
                diagnostics:
                  type: object
                  properties:
                    events: { type: array, items: {} }
                    stderr: { type: string }
    TraceSummary:
      type: object
      required: [total_retained, completed, failed, running, queue, retention_ms, max_entries, content_capture_enabled]
      properties:
        total_retained: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        queue: { $ref: "#/components/schemas/QueueStats" }
        retention_ms: { type: integer, minimum: 60000 }
        max_entries: { type: integer, minimum: 10 }
        content_capture_enabled: { type: boolean }
        persistence_enabled: { type: boolean }
        success_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        latency_ms:
          type: object
          properties:
            average: { type: [integer, "null"] }
            p50: { type: [integer, "null"] }
            p95: { type: [integer, "null"] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, request_id]
          properties:
            message:
              type: string
            type:
              type: string
            details: {}
            request_id:
              type: string
              format: uuid
  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
