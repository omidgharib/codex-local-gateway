<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Gateway Dashboard</title>
  <style>
    @font-face {
      font-family: "Vazirmatn";
      src: url("/assets/Vazirmatn-Variable.woff2") format("woff2-variations");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }
    :root { color-scheme: dark; font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif; font-synthesis: none; background: #0b1020; color: #e7ecf5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #172554, #0b1020 42%); }
    main { width: min(1180px, calc(100% - 32px)); margin: 32px auto; }
    header { display: flex; gap: 20px; justify-content: space-between; align-items: end; flex-wrap: wrap; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 38px); font-weight: 800; letter-spacing: -.025em; }
    .muted { color: #95a3bd; }
    .auth { display: flex; gap: 8px; direction: ltr; }
    input, select, button { font: inherit; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; background: #11182b; color: inherit; }
    input { min-width: 260px; }
    button { cursor: pointer; background: #2563eb; border-color: #3b82f6; font-weight: 700; }
    button.secondary { background: #182235; }
    .cards { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 12px; margin: 24px 0; }
    .card, .panel { background: rgba(17, 24, 43, .88); border: 1px solid #24314a; border-radius: 16px; box-shadow: 0 18px 60px rgba(0,0,0,.2); }
    .card { padding: 16px; }
    .card b { display: block; font-size: 26px; margin-top: 8px; }
    .panel { overflow: hidden; }
    .toolbar { display: flex; gap: 10px; padding: 14px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #24314a; }
    .toolbar input { min-width: 180px; flex: 1; }
    table { width: 100%; border-collapse: collapse; direction: ltr; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #202c43; white-space: nowrap; }
    th { color: #9eacc4; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    tbody tr:hover { background: #151f34; }
    tbody tr[data-request-id] { cursor: pointer; }
    tbody tr[data-request-id]:focus { outline: 2px solid #60a5fa; outline-offset: -2px; }
    tbody tr.selected { background: #1e3a5f; }
    .status { border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 700; }
    .completed { background: #064e3b; color: #6ee7b7; }
    .failed { background: #581c1c; color: #fca5a5; }
    .running { background: #1e3a8a; color: #93c5fd; }
    .queued { background: #4a2c0a; color: #fcd34d; }
    .empty { text-align: center; color: #95a3bd; padding: 48px; }
    #notice { min-height: 22px; margin: 12px 0; color: #fca5a5; }
    #details { width: min(1080px, calc(100% - 32px)); height: min(820px, calc(100vh - 48px)); margin: auto; padding: 0; color: inherit; background: #11182b; border: 1px solid #3b82f6; border-radius: 16px; box-shadow: 0 24px 90px rgba(0, 0, 0, .6); overflow: hidden; }
    #details::backdrop { background: rgba(2, 6, 23, .76); backdrop-filter: blur(3px); }
    .details-shell { display: flex; flex-direction: column; height: 100%; }
    .details-header { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 18px 20px; border-bottom: 1px solid #24314a; }
    .details-header h2 { margin: 0; font-size: 18px; }
    .details-actions { display: flex; gap: 8px; }
    .details-actions button { min-height: 44px; }
    .details-body { display: flex; flex-direction: column; min-height: 0; flex: 1; padding: 18px 20px 20px; }
    .detail-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; direction: ltr; }
    .detail-field { min-width: 0; padding: 10px 12px; border: 1px solid #24314a; border-radius: 10px; background: #0d1425; }
    .detail-field dt { color: #95a3bd; font-size: 12px; margin-bottom: 4px; }
    .detail-field dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-warning { margin: 0 0 16px; padding: 12px 14px; border: 1px solid #854d0e; border-radius: 10px; background: #422006; color: #fde68a; line-height: 1.7; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid #24314a; direction: ltr; }
    .tab { min-height: 44px; padding: 9px 14px; border: 0; border-bottom: 2px solid transparent; border-radius: 8px 8px 0 0; background: transparent; color: #9eacc4; white-space: nowrap; }
    .tab[aria-selected="true"] { color: #eff6ff; border-bottom-color: #60a5fa; background: #17243a; }
    .tab-panel { min-height: 0; flex: 1; overflow: auto; margin-top: 12px; }
    .tab-panel[hidden] { display: none; }
    .json-view { direction: ltr; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 100%; margin: 0; padding: 16px; border-radius: 10px; background: #080d19; color: #d5deec; font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size: 2; }
    .empty-detail { display: grid; place-items: center; min-height: 220px; padding: 28px; border: 1px dashed #334155; border-radius: 10px; color: #95a3bd; text-align: center; line-height: 1.8; }
    @media (max-width: 820px) { .cards { grid-template-columns: repeat(2, 1fr); } .panel { overflow-x: auto; } .detail-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { #details { width: 100%; height: 100%; max-height: none; border-radius: 0; } .detail-summary { grid-template-columns: 1fr; } .details-header, .details-body { padding-inline: 14px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>داشبورد Codex Gateway</h1>
        <div class="muted">مشاهده وضعیت، پارامترها، پاسخ و اطلاعات تشخیصی درخواست‌ها</div>
      </div>
      <form class="auth" id="auth-form">
        <input id="token" type="password" autocomplete="off" placeholder="LOCAL_CODEX_GATEWAY_TOKEN" aria-label="Gateway token">
        <button type="submit">اتصال</button>
      </form>
    </header>
    <div id="notice"></div>
    <section class="cards">
      <div class="card"><span class="muted">نگهداری‌شده</span><b id="total">—</b></div>
      <div class="card"><span class="muted">موفق</span><b id="completed">—</b></div>
      <div class="card"><span class="muted">ناموفق</span><b id="failed">—</b></div>
      <div class="card"><span class="muted">در حال اجرا</span><b id="running">—</b></div>
      <div class="card"><span class="muted">در صف</span><b id="queued">—</b></div>
    </section>
    <section class="panel">
      <div class="toolbar">
        <input id="search" placeholder="جستجو با request id یا workspace">
        <select id="status" aria-label="Status filter">
          <option value="">همه وضعیت‌ها</option>
          <option value="queued">Queued</option>
          <option value="running">Running</option>
          <option value="completed">Completed</option>
          <option value="failed">Failed</option>
        </select>
        <button class="secondary" id="refresh" type="button">به‌روزرسانی</button>
        <span class="muted" id="policy"></span>
      </div>
      <table>
        <thead><tr><th>Queued at</th><th>Request ID</th><th>Status</th><th>Mode</th><th>Workspace</th><th>Wait</th><th>Execution</th><th>Output</th><th>Error</th></tr></thead>
        <tbody id="rows"><tr><td class="empty" colspan="9">برای مشاهده traceها token را وارد کنید.</td></tr></tbody>
      </table>
    </section>
    <dialog id="details" aria-labelledby="detail-title">
      <div class="details-shell">
        <div class="details-header">
          <h2 id="detail-title">جزئیات درخواست</h2>
          <div class="details-actions">
            <button class="secondary" id="copy-details" type="button">کپی بخش فعال</button>
            <button class="secondary" id="close-details" type="button">بستن</button>
          </div>
        </div>
        <div class="details-body" id="detail-content" aria-live="polite">
          <div class="empty-detail">در حال دریافت جزئیات…</div>
        </div>
      </div>
    </dialog>
  </main>
  <script>
    const state = { token: sessionStorage.getItem("gateway-token") || "", traces: [], selectedId: null, activeTab: "request", activeDetail: null };
    const $ = (id) => document.getElementById(id);
    $("token").value = state.token;

    $("auth-form").addEventListener("submit", (event) => {
      event.preventDefault();
      state.token = $("token").value.trim();
      sessionStorage.setItem("gateway-token", state.token);
      refresh();
    });
    $("refresh").addEventListener("click", refresh);
    $("search").addEventListener("input", renderRows);
    $("status").addEventListener("change", renderRows);
    $("rows").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-request-id]");
      if (row) showDetails(row.dataset.requestId);
    });
    $("rows").addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const row = event.target.closest("tr[data-request-id]");
      if (!row) return;
      event.preventDefault();
      showDetails(row.dataset.requestId);
    });
    $("close-details").addEventListener("click", hideDetails);
    $("copy-details").addEventListener("click", copyActiveDetails);
    $("detail-content").addEventListener("click", (event) => {
      const tab = event.target.closest("[role=tab]");
      if (tab) activateTab(tab.dataset.tab);
    });
    $("detail-content").addEventListener("keydown", (event) => {
      const tab = event.target.closest("[role=tab]");
      if (!tab || !["ArrowLeft", "ArrowRight"].includes(event.key)) return;
      const tabs = [...$("detail-content").querySelectorAll("[role=tab]")];
      const offset = event.key === "ArrowRight" ? 1 : -1;
      const next = tabs[(tabs.indexOf(tab) + offset + tabs.length) % tabs.length];
      next.focus();
      activateTab(next.dataset.tab);
    });

    async function refresh() {
      if (!state.token) return showError("Token محلی را وارد کنید.");
      try {
        const response = await fetch("/v1/logs", { headers: { authorization: `Bearer ${state.token}` } });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error?.message || `HTTP ${response.status}`);
        state.traces = body.data;
        $("total").textContent = body.summary.total_retained;
        $("completed").textContent = body.summary.completed;
        $("failed").textContent = body.summary.failed;
        $("running").textContent = body.summary.running;
        $("queued").textContent = body.summary.queue.queued;
        $("policy").textContent = `${body.summary.content_capture_enabled ? "ثبت محتوای کامل: فعال" : "ثبت محتوای کامل: غیرفعال"} · Retention: ${formatDuration(body.summary.retention_ms)} · Max: ${body.summary.max_entries}`;
        showError("");
        renderRows();
      } catch (error) { showError(error.message); }
    }

    function renderRows() {
      const query = $("search").value.toLowerCase();
      const status = $("status").value;
      const filtered = state.traces.filter((trace) =>
        (!status || trace.status === status) &&
        (!query || `${trace.id} ${trace.workspace || ""}`.toLowerCase().includes(query))
      );
      $("rows").innerHTML = filtered.length ? filtered.map((trace) => `
        <tr data-request-id="${escapeHtml(trace.id)}" tabindex="0" aria-label="مشاهده جزئیات ${escapeHtml(trace.id)}" class="${trace.id === state.selectedId ? "selected" : ""}">
          <td>${escapeHtml(new Date(trace.queued_at).toLocaleString())}</td>
          <td title="${escapeHtml(trace.id)}">${escapeHtml(trace.id.slice(0, 8))}</td>
          <td><span class="status ${trace.status}">${escapeHtml(trace.status)}</span></td>
          <td>${escapeHtml(trace.mode)}</td>
          <td>${escapeHtml(trace.workspace || "—")}</td>
          <td>${formatMs(trace.queue_wait_ms)}</td>
          <td>${formatMs(trace.execution_ms)}</td>
          <td>${trace.output_chars ?? "—"}</td>
          <td>${escapeHtml(trace.error_type || "—")}</td>
        </tr>`).join("") : '<tr><td class="empty" colspan="9">رکوردی وجود ندارد.</td></tr>';
    }

    async function showDetails(requestId) {
      if (!state.token) return showError("Token محلی را وارد کنید.");
      state.selectedId = requestId;
      state.activeTab = "request";
      state.activeDetail = null;
      renderRows();
      if (!$("details").open) $("details").showModal();
      $("detail-content").innerHTML = '<div class="empty-detail">در حال دریافت جزئیات…</div>';
      try {
        const response = await fetch(`/v1/logs/${encodeURIComponent(requestId)}`, { headers: { authorization: `Bearer ${state.token}` } });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error?.message || `HTTP ${response.status}`);
        state.activeDetail = body.data;
        renderDetails(body.data);
        showError("");
      } catch (error) {
        $("detail-content").innerHTML = '<div class="empty-detail">جزئیات قابل دریافت نیست.</div>';
        showError(error.message);
      }
    }

    function hideDetails() {
      state.selectedId = null;
      state.activeDetail = null;
      $("details").close();
      renderRows();
    }

    function renderDetails(trace) {
      const detail = trace.detail || {};
      const sections = [
        ["request", "Request", detail.request],
        ["response", "Response", detail.response],
        ["error", "Error", detail.error],
        ["diagnostics", "Events & stderr", detail.diagnostics],
        ["raw", "Raw trace", trace],
      ].filter(([key, , value]) => key === "raw" || value !== undefined);
      if (!sections.some(([key]) => key === state.activeTab)) state.activeTab = sections[0][0];
      const warning = trace.details_available ? "" : `
        <p class="detail-warning">ثبت محتوای کامل غیرفعال بوده است. برای دیدن پارامترها و پاسخ، <code>CODEX_TRACE_CONTENT=true</code> را تنظیم و Gateway را دوباره اجرا کنید. این تنظیم فقط روی درخواست‌های جدید اثر دارد.</p>`;
      $("detail-content").innerHTML = `
        <dl class="detail-summary">
          ${detailField("Request ID", trace.id)}
          ${detailField("Status", trace.status)}
          ${detailField("Endpoint", trace.endpoint || "—")}
          ${detailField("Model", trace.model || "—")}
          ${detailField("Mode", trace.mode || "—")}
          ${detailField("Workspace", trace.workspace || "—")}
          ${detailField("Queue wait", formatMs(trace.queue_wait_ms))}
          ${detailField("Execution", formatMs(trace.execution_ms))}
        </dl>
        ${warning}
        <div class="tabs" role="tablist" aria-label="بخش‌های جزئیات درخواست">
          ${sections.map(([key, label]) => `<button class="tab" type="button" role="tab" id="tab-${key}" data-tab="${key}" aria-controls="panel-${key}" aria-selected="${key === state.activeTab}">${label}</button>`).join("")}
        </div>
        ${sections.map(([key, , value]) => `
          <section class="tab-panel" role="tabpanel" id="panel-${key}" aria-labelledby="tab-${key}" data-panel="${key}" ${key === state.activeTab ? "" : "hidden"}>
            <pre class="json-view">${escapeHtml(JSON.stringify(value, null, 2))}</pre>
          </section>`).join("")}`;
    }

    function detailField(label, value) {
      return `<div class="detail-field"><dt>${escapeHtml(label)}</dt><dd title="${escapeHtml(value)}">${escapeHtml(value)}</dd></div>`;
    }

    function activateTab(tabName) {
      state.activeTab = tabName;
      for (const tab of $("detail-content").querySelectorAll("[role=tab]")) tab.setAttribute("aria-selected", String(tab.dataset.tab === tabName));
      for (const panel of $("detail-content").querySelectorAll("[role=tabpanel]")) panel.hidden = panel.dataset.panel !== tabName;
    }

    async function copyActiveDetails() {
      const panel = $("detail-content").querySelector(`[data-panel="${state.activeTab}"] .json-view`);
      if (!panel) return;
      const button = $("copy-details");
      try {
        await navigator.clipboard.writeText(panel.textContent);
        button.textContent = "کپی شد";
      } catch {
        showError("کپی خودکار ممکن نبود؛ متن را دستی انتخاب کنید.");
      } finally {
        setTimeout(() => { button.textContent = "کپی بخش فعال"; }, 1400);
      }
    }

    function formatMs(value) { return Number.isFinite(value) ? `${value} ms` : "—"; }
    function formatDuration(value) { return value % 3600000 === 0 ? `${value / 3600000}h` : `${Math.round(value / 60000)}m`; }
    function showError(message) { $("notice").textContent = message; }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char])); }

    if (state.token) refresh();
    setInterval(() => { if (state.token) refresh(); }, 5000);
  </script>
</body>
</html>
